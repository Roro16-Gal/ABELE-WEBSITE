<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABELE 2026</title>
  <style>
    :root {
      --green-950:#052e22; --green-900:#064e3b; --green-800:#065f46; --green-700:#047857;
      --mint:#d1fae5; --teal:#0f766e; --gold:#f59e0b; --red:#dc2626;
      --ink:#0f172a; --muted:#64748b; --line:#dbe3ea; --paper:#ffffff; --wash:#f5f8f6;
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:var(--wash); }
    header { position:sticky; top:0; z-index:10; background:var(--green-900); color:white; box-shadow:0 8px 22px rgba(5,46,34,.18); }
    .bar { max-width:1120px; margin:auto; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .brand { display:flex; gap:12px; align-items:center; min-width:0; }
    .mark { width:42px; height:42px; border-radius:8px; display:grid; place-items:center; background:var(--green-700); font-weight:900; }
    h1 { margin:0; font-size:18px; line-height:1.15; }
    .sub { margin:2px 0 0; color:#b7f7d7; font-size:12px; font-weight:600; }
    main { max-width:1120px; margin:auto; padding:24px 20px 48px; }
    .screen { display:none; } .screen.active { display:block; animation:rise .25s ease-out; }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .panel { background:var(--paper); border:1px solid var(--line); border-radius:8px; box-shadow:0 18px 40px rgba(15,23,42,.08); }
    .home { max-width:780px; margin:22px auto; padding:28px; }
    h2 { margin:0; font-size:30px; line-height:1.1; letter-spacing:0; }
    .lead { color:var(--muted); margin:10px 0 24px; line-height:1.55; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
    .subject { border:2px solid var(--line); background:white; border-radius:8px; padding:16px; text-align:left; cursor:pointer; transition:.16s ease; min-height:104px; }
    .subject:hover, .subject.selected { border-color:var(--green-700); background:#f0fdf4; transform:translateY(-1px); }
    .subject b { display:block; font-size:15px; margin-bottom:7px; }
    .subject span { color:var(--muted); font-size:13px; }
    .settings { display:grid; grid-template-columns:minmax(180px,1fr) auto; gap:12px; align-items:end; margin-top:22px; padding-top:20px; border-top:1px solid var(--line); }
    label { display:block; font-size:13px; font-weight:800; margin-bottom:7px; color:#334155; }
    input { width:100%; border:1px solid #cbd5e1; border-radius:8px; padding:12px 13px; font:inherit; }
    button { font:inherit; }
    .primary, .ghost, .danger { border:0; border-radius:8px; padding:12px 16px; font-weight:800; cursor:pointer; min-height:44px; }
    .primary { background:var(--green-800); color:white; box-shadow:0 8px 18px rgba(6,95,70,.22); }
    .primary:hover { background:var(--green-950); }
    .ghost { background:#eef5f1; color:#134e4a; }
    .danger { background:white; color:#475569; border:1px solid var(--line); }
    .quiz-wrap { max-width:860px; margin:0 auto; }
    .progress-row { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:13px; font-weight:800; margin:8px 0; }
    .track { height:10px; border-radius:999px; background:#e2e8f0; overflow:hidden; margin-bottom:14px; }
    .fill { height:100%; width:0; background:linear-gradient(90deg,var(--green-700),var(--teal)); transition:width .25s ease; }
    .question { padding:24px; }
    .tag { display:inline-flex; padding:6px 10px; border-radius:999px; color:#065f46; background:#dff9eb; font-size:12px; font-weight:900; margin-bottom:14px; }
    .qtext { font-size:21px; line-height:1.45; margin:0 0 18px; font-weight:800; }
    .options { display:grid; gap:10px; }
    .option { width:100%; display:flex; align-items:center; gap:12px; border:2px solid var(--line); border-radius:8px; background:white; padding:13px; text-align:left; cursor:pointer; min-height:58px; }
    .option:hover { border-color:#94d6bd; background:#fbfffd; }
    .option.selected { border-color:var(--green-700); background:#ecfdf5; }
    .letter { width:32px; height:32px; border-radius:8px; display:grid; place-items:center; background:#eef2f7; color:#475569; font-weight:900; flex:0 0 auto; }
    .actions { display:flex; justify-content:space-between; gap:12px; margin-top:18px; }
    .results { max-width:920px; margin:0 auto; }
    .score { padding:26px; display:grid; gap:18px; grid-template-columns:1fr auto; align-items:center; }
    .score-num { font-size:48px; font-weight:900; color:var(--green-800); }
    .review { margin-top:16px; display:grid; gap:10px; }
    .review-card { padding:16px; border-left:5px solid var(--line); }
    .review-card.good { border-left-color:var(--green-700); }
    .review-card.bad { border-left-color:var(--red); }
    .review-card p { margin:6px 0; line-height:1.45; }
    .tiny { color:var(--muted); font-size:12px; }
    .hidden { display:none !important; }
    @media (max-width:650px) {
      .bar { align-items:flex-start; }
      h2 { font-size:25px; }
      .home, .question { padding:18px; }
      .settings, .score { grid-template-columns:1fr; }
      .actions { flex-direction:column-reverse; }
      .primary, .ghost, .danger { width:100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand">
        <div class="mark">A2</div>
        <div>
          <h1>ABELE 2026</h1>
          <p class="sub">Agircultural and Biosystems Engineering Licensure Examination</p>
        </div>
      </div>
      <button class="ghost" onclick="resetHome()">Home</button>
    </div>
  </header>

  <main>
    <section id="home" class="screen active">
      <div class="panel home">
        <h2>Choose the subject</h2>
        <p class="lead">Land and Water Resources Engineering & Allied Subject</p>
        <div id="subjects" class="grid"></div>
        <div clabans="settings">
          <div>
            <label for="count">Number of questions (minimum 10)</label>
            <input id="count" type="number" min="10" value="10">
            <p id="countHelp" class="tiny">Magiging Engineer ka sa pasko!!</p>
          </div>
          <button class="primary" onclick="startQuiz()">Start Quiz</button>
        </div>
      </div>
    </section>

    <section id="quiz" class="screen">
      <div class="quiz-wrap">
        <div class="progress-row"><span id="progressText"></span><span id="percentText"></span></div>
        <div class="track"><div id="fill" class="fill"></div></div>
        <div class="panel question">
          <span id="qSubject" class="tag"></span>
          <p id="qText" class="qtext"></p>
          <div id="options" class="options"></div>
          <div class="actions">
            <button class="danger" onclick="resetHome()">Abandon Quiz</button>
            <button id="nextBtn" class="primary" onclick="nextQuestion()" disabled>Next Question</button>
          </div>
        </div>
      </div>
    </section>

    <section id="results" class="screen">
      <div class="results">
        <div class="panel score">
          <div>
            <h2>Quiz complete.</h2>
            <p id="summary" class="lead"></p>
          </div>
          <div class="score-num" id="scoreNum"></div>
          <button class="primary" onclick="resetHome()">Practice Again</button>
        </div>
        <div id="review" class="review"></div>
      </div>
    </section>
  </main>

  <script>
    const questionBank = [{"id": "GEN-1", "subject": "General Terminologies", "term": "Access area", "definition": "areas open for public entry such as golf courses, public and private parks"}, {"id": "GEN-2", "subject": "General Terminologies", "term": "Active storage", "definition": "volume of water stored in reservoir between the minimum water level and normal water level"}, {"id": "GEN-3", "subject": "General Terminologies", "term": "Actual crop evapotranspiratio n", "definition": "rate of evapotranspiration equal or smaller than predicted crop evapotranspiration"}, {"id": "GEN-4", "subject": "General Terminologies", "term": "Afflux elevation", "definition": "rise in maximum flood level from thr original unobstructed flood level"}, {"id": "GEN-5", "subject": "General Terminologies", "term": "Algal bloom", "definition": "overgrowths of algae in water producing dangerous toxins in fresh or marine water"}, {"id": "GEN-6", "subject": "General Terminologies", "term": "Application efficiency", "definition": "ratio of average depth of water infiltrated and stored in the root zone to the average depth of irrigation water applied"}, {"id": "GEN-7", "subject": "General Terminologies", "term": "Aquifer", "definition": "contains water and transmit it at a rate sufficient to be economically developed for pumping artificially developed well"}, {"id": "GEN-8", "subject": "General Terminologies", "term": "Area", "definition": "cross sectional area of the flow which is measured perpendicular to the direction of flow"}, {"id": "GEN-9", "subject": "General Terminologies", "term": "Basin", "definition": "field that is level in all directions, encompassed by a dike to prevent runoff, and provides an undirected flow of water onto the field"}, {"id": "GEN-10", "subject": "General Terminologies", "term": "Basin irrigation", "definition": "type of surface irrigation where water is applied to the basin through a gap in the perimeter dike or adjacent ditch; water is retained until it infiltrates into the soil or the excess is drained off"}, {"id": "GEN-11", "subject": "General Terminologies", "term": "Bearing capacity", "definition": "maximum average contact pressure between the foundation and the soil"}, {"id": "GEN-12", "subject": "General Terminologies", "term": "Border irrigation", "definition": "method of irrigation which makes use of parallel border strips"}, {"id": "GEN-13", "subject": "General Terminologies", "term": "Border strip", "definition": "area of land bounded by two border ridges or dikes"}, {"id": "GEN-14", "subject": "General Terminologies", "term": "Channel bed slope", "definition": "inclination or elevation drop per unit length of the channel bottom"}, {"id": "GEN-15", "subject": "General Terminologies", "term": "Confined aquifer", "definition": "groundwater that is confined by relatively impermeable layer"}, {"id": "GEN-16", "subject": "General Terminologies", "term": "Contamination", "definition": "introduction of substances not found in the natural composition of water that make the water less desirable or unfit for intended use"}, {"id": "GEN-17", "subject": "General Terminologies", "term": "Conveyance efficiency", "definition": "ratio between water received at the inlet for a block of fields to that released at the project’s headwork"}, {"id": "GEN-18", "subject": "General Terminologies", "term": "Conveyance loss", "definition": "loss of water from a channel during transport due to seepage and percolation"}, {"id": "GEN-19", "subject": "General Terminologies", "term": "Critical depth", "definition": "depth of water flow where the energy content is at minimum hence, no other backwater forces are involved"}, {"id": "GEN-20", "subject": "General Terminologies", "term": "Crop coefficient", "definition": "ratio of the actual crop evapotranspiration to its potential evapotranspiration"}, {"id": "GEN-21", "subject": "General Terminologies", "term": "Crop evapotranspiration", "definition": "free crop; includes water loss through transpiration by the vegetation, and vaporation from the soil surface and wet leaves"}, {"id": "GEN-22", "subject": "General Terminologies", "term": "Cropping pattern", "definition": "sequence of different crops grown in regular order on any particular field or fields"}, {"id": "GEN-23", "subject": "General Terminologies", "term": "Crop water requirements", "definition": "sum of evapotranspiration or consumptive use plus seepage and percolation losses"}, {"id": "GEN-24", "subject": "General Terminologies", "term": "Dam", "definition": "any barrier constructed to store water"}, {"id": "GEN-25", "subject": "General Terminologies", "term": "Dam height", "definition": "vertical distance from lowest point of the ground line to the dam crest"}, {"id": "GEN-26", "subject": "General Terminologies", "term": "Dead storage", "definition": "volume below intake structure; sediment volume based on 25 years of accumulation in the reservoir"}, {"id": "GEN-27", "subject": "General Terminologies", "term": "Depth", "definition": "depth of water in the channel cross section"}, {"id": "GEN-28", "subject": "General Terminologies", "term": "Designed height", "definition": "actual height of the embankment after settlement"}, {"id": "GEN-29", "subject": "General Terminologies", "term": "Design irrigable area", "definition": "maximum area which an irrigation project can serve considering the extent of arable lands and the available water supply"}, {"id": "GEN-30", "subject": "General Terminologies", "term": "Distributioon uniformity", "definition": "numerical value on the uniformity of application for agricultural irrigation systems"}, {"id": "GEN-31", "subject": "General Terminologies", "term": "Diversion dam", "definition": "structure or weir provided across the river or creek to raise its water level and divert the water into the main canal to facilitate irrigation by gravity"}, {"id": "GEN-32", "subject": "General Terminologies", "term": "Diversion water requirement", "definition": "the total quantity of water diverted from the stream, lake, or reservoir, or removed from the ground in order to irrigate a crop"}, {"id": "GEN-33", "subject": "General Terminologies", "term": "Drip irrigation", "definition": "also known as trickle irrigation; involves dripping water onto the soil at very low rates (220 liters/hour) from the emitters where water is applied close to plants so that only part of the soil in which the roots grow is wetted"}, {"id": "GEN-34", "subject": "General Terminologies", "term": "Drop", "definition": "in line canal structure designed to convey canal water from a higher level to a lower level, duly dissipating the excess energy resulting from the drop in elevation"}, {"id": "GEN-35", "subject": "General Terminologies", "term": "Effective rainfall", "definition": "amount of rainwater that falls directly on the field and is used by the crop for growth and development excluding deep percolation, surface runoff and interception"}, {"id": "GEN-36", "subject": "General Terminologies", "term": "Effective rooting depth", "definition": "soil depth from which the bulk of the roots of the crop extracts most of the water needed for evapostranspiration"}, {"id": "GEN-37", "subject": "General Terminologies", "term": "Effective size", "definition": "particle diameter corresponding to 10% sieve passing"}, {"id": "GEN-38", "subject": "General Terminologies", "term": "Effluent", "definition": "discharges from known sources which is passed into a body of water or land, or wastewater flowing out of manufacturing plant"}, {"id": "GEN-39", "subject": "General Terminologies", "term": "Effluent standard", "definition": "any legal restriction or limitation on quantities, rates, and/or concentrations or any combination thereof, of physical, chemical or biological parameters of effluent"}, {"id": "GEN-40", "subject": "General Terminologies", "term": "Elevated flume", "definition": "water conveying conduit or trough which is supported on abutments by piers"}, {"id": "GEN-41", "subject": "General Terminologies", "term": "Emitter spacing", "definition": "spacing between emitters or emission points along a lateral line"}, {"id": "GEN-42", "subject": "General Terminologies", "term": "Emitters", "definition": "applicator used in drip, subsurface, or bubbler irrigation designed to disspate pressure and to discharge a small uniform flow or trickle of water at a constant rate"}, {"id": "GEN-43", "subject": "General Terminologies", "term": "Energy grade line", "definition": "specific energy line; grade line of the water surface profile plus the velocity head in open channels"}, {"id": "GEN-44", "subject": "General Terminologies", "term": "Equipment crossing", "definition": "provision for passing of equipment and small machinery"}, {"id": "GEN-45", "subject": "General Terminologies", "term": "Evapotranspiration", "definition": "combination of water transpired from vegetation and evaporated from the soil, water, and plant surfaces"}, {"id": "GEN-46", "subject": "General Terminologies", "term": "Farm ditch", "definition": "channel which conveys irrigation water from the turnout to the paddy field"}, {"id": "GEN-47", "subject": "General Terminologies", "term": "Filter drain", "definition": "dam component which prevents migration of small particles and screen off fine materials that flow with seepage water and prevent piping"}, {"id": "GEN-48", "subject": "General Terminologies", "term": "Finished height", "definition": "height of the embankment to be attained during construction"}, {"id": "GEN-49", "subject": "General Terminologies", "term": "Farm water requirement", "definition": "amount of water to replenish the crop water requirement and losses less the effective rainfall"}, {"id": "GEN-50", "subject": "General Terminologies", "term": "Freeboard", "definition": "additional height of the dam provided as a safety factor to prevent overtopping by wave action or other causes"}, {"id": "GEN-51", "subject": "General Terminologies", "term": "Furrows", "definition": "small parallel channels, made to carry water in order to irrigate the crop"}, {"id": "GEN-52", "subject": "General Terminologies", "term": "Furrow irrigation", "definition": "method of irrigation where water runs through small parallel channels as it moves down the slope"}, {"id": "GEN-53", "subject": "General Terminologies", "term": "Furrow irrigation", "definition": "method of irrigation where water runs through small parallel channels as it moves down the slope of the field"}, {"id": "GEN-54", "subject": "General Terminologies", "term": "Head ditch", "definition": "supply ditch; small channel along one part of a field that is used for distributing water in surface irrigation"}, {"id": "GEN-55", "subject": "General Terminologies", "term": "Homogeneous embankment", "definition": "dam composed of a single kind of embankment material exclusive for slope protection"}, {"id": "GEN-56", "subject": "General Terminologies", "term": "Hydraulic depth", "definition": "ratio of flow area to the wetted top width"}, {"id": "GEN-57", "subject": "General Terminologies", "term": "Hydraulic grade line", "definition": "hydraulic gradient; profile of the free water surface"}, {"id": "GEN-58", "subject": "General Terminologies", "term": "Hydraulic jump", "definition": "occurs when a thin sheet of incoming flow moving at high velocity strikes water of sufficient depth"}, {"id": "GEN-59", "subject": "General Terminologies", "term": "Hydraulic radius", "definition": "cross sectional area of flow divided by the wetted perimeter"}, {"id": "GEN-60", "subject": "General Terminologies", "term": "Hydraulic jump", "definition": "occurs when a thin sheet of incoming flow moving at high velocity strikes water of sufficient depth"}, {"id": "GEN-61", "subject": "General Terminologies", "term": "Hydraulic frequency analysis", "definition": "estimation of the chance or likelihood of occurrence of a given event by determining the frequency curves of best fit to samples of hydrologic data"}, {"id": "GEN-62", "subject": "General Terminologies", "term": "Inside slope", "definition": "slope of the upstream face of the embankment"}, {"id": "GEN-63", "subject": "General Terminologies", "term": "Invert", "definition": "inside bottom or sill of the conduit"}, {"id": "GEN-64", "subject": "General Terminologies", "term": "Inverted siphon", "definition": "closed conduit designed to convey canal water in full and under pressure running condition, to convey canal water by gravity under roadways, railways, drainage channels and local depressions"}, {"id": "GEN-65", "subject": "General Terminologies", "term": "Irrigation period", "definition": "time required to cover an area with one application of water"}, {"id": "GEN-66", "subject": "General Terminologies", "term": "Karst topography", "definition": "geological formation shaped by the dissolution of a layer or layes of soluble bedrock, usually carbonate rocks such as limestone or dolomite"}, {"id": "GEN-67", "subject": "General Terminologies", "term": "Land preparation water requirement", "definition": "amount of water required in lowland rice production which includes water losses through evaporation, seepage and percolation and land soaking"}, {"id": "GEN-68", "subject": "General Terminologies", "term": "Land soaking water requirement", "definition": "amount of water required in lowland rice production which is a function of the initial soil moisture and the physical properties of the soil"}, {"id": "GEN-69", "subject": "General Terminologies", "term": "Lateral spacing", "definition": "spacing between irrigation laterals"}, {"id": "GEN-70", "subject": "General Terminologies", "term": "Leaching", "definition": "deep percolation of water beyond the root zone of plants, resulting in loss of salts or nutrients"}, {"id": "GEN-71", "subject": "General Terminologies", "term": "Lined channel", "definition": "lined canal; canals with impermeable maters (usually concrete) for channel stabilization and/or reduced seepage"}, {"id": "GEN-72", "subject": "General Terminologies", "term": "Loading limit", "definition": "allowable pollutant loading limit per unit of time"}, {"id": "GEN-73", "subject": "General Terminologies", "term": "Manifold", "definition": "portion of the pipe network between the mainline and the laterals"}, {"id": "GEN-74", "subject": "General Terminologies", "term": "Manufacturer’s coefficient of variation", "definition": "measure the variability of discharge of a random sample of a given make, model and size of emitter, as provided by the manufacturer and before any field operations or aging has taken place determined through a discharge test of a sample of 50 emitters under a set pressure at 200 C"}, {"id": "GEN-75", "subject": "General Terminologies", "term": "Natural spillway", "definition": "spillway which is not excavated such as natural draw, saddle or drainage way"}, {"id": "GEN-76", "subject": "General Terminologies", "term": "Normal depth", "definition": "constant flow depth along a longitudinal section of a channel under a uniform flow condition"}, {"id": "GEN-77", "subject": "General Terminologies", "term": "Normal storage elevation", "definition": "maximum elevation the water surface which can be attained by the dam or reservoir without flow in the spillway"}, {"id": "GEN-78", "subject": "General Terminologies", "term": "Open channel flow", "definition": "water flow that is conveyed in such a manner that top surface is exposed to the atmosphere such as flow in canals, ditches, drainage channel, culverts, and pipes under partially full flow conditions"}, {"id": "GEN-79", "subject": "General Terminologies", "term": "Optimal emitter spacing", "definition": "drip emitter spacing which is 80% of the wetted diameter estimated from the field tests"}, {"id": "GEN-80", "subject": "General Terminologies", "term": "Outside slope", "definition": "slope at the downstream face of the emabankment"}, {"id": "GEN-81", "subject": "General Terminologies", "term": "Pan coefficient", "definition": "ratio between reference evapotranspiration and water loss by evaporation from an open water surface of a pan"}, {"id": "GEN-82", "subject": "General Terminologies", "term": "Pan evaporation", "definition": "rate of water loss by evaporation from an open water surface of a pan"}, {"id": "GEN-83", "subject": "General Terminologies", "term": "Percolation", "definition": "vertical flow of water to below the root zone which is affected by soil structure, texture, bulk density, mineralogy, organic matter content, salt type and concentration"}, {"id": "GEN-84", "subject": "General Terminologies", "term": "Permeability test", "definition": "method to determine the rate of flow under laminar flow conditions through a unit cross sectional area of soil under unit hydraulic gradient"}, {"id": "GEN-85", "subject": "General Terminologies", "term": "Pollutant", "definition": "directly or indirectly alters the quality of any segment of the receiving water body or land resource so as to affect or tend to affect adversely any beneficial use"}, {"id": "GEN-86", "subject": "General Terminologies", "term": "Pond", "definition": "sealed section formed between embankments where combined seepage and percolation will be measure"}, {"id": "GEN-87", "subject": "General Terminologies", "term": "Potential irrigable area", "definition": "area capable of being irrigated, principally as regards to regards to availability of water, suitable soils, and topography of land"}, {"id": "GEN-88", "subject": "General Terminologies", "term": "Reference crop evapotranspiration", "definition": "rate of evapotranspiration from a reference surface which is a hypothetical reference crop with an assumed crop height of 0.2m, a fixed surface resistance of 70s/m and an albedo of 0.23"}, {"id": "GEN-89", "subject": "General Terminologies", "term": "Reservoir", "definition": "part of the system that impounds the runoff"}, {"id": "GEN-90", "subject": "General Terminologies", "term": "Residual moisture content", "definition": "moisture left in the soil before the initial irrigation water delivery which describes the extent of water depletion from the soil when the water supply has been cut off"}, {"id": "GEN-91", "subject": "General Terminologies", "term": "Restricted area", "definition": "areas with limited entry such as freeway landscape, highway medians and other similar areas"}, {"id": "GEN-92", "subject": "General Terminologies", "term": "Reuse", "definition": "taking wastewater from one industry or process, treating it and then using it in another process or industry such as for irrigation, as liquid fertilizer and for aquaculture"}, {"id": "GEN-93", "subject": "General Terminologies", "term": "Road crossing", "definition": "conveys canal water under roads or railroads"}, {"id": "GEN-94", "subject": "General Terminologies", "term": "Shallow tubewell", "definition": "tube or shaft vertically set into the ground at a depth is usually less than 15m for the purpose of bringing groundwater into the soil surface whose pumps are set above the water level"}, {"id": "GEN-95", "subject": "General Terminologies", "term": "Seismicity", "definition": "occurrence of frequency of earthquakes in a region"}, {"id": "GEN-96", "subject": "General Terminologies", "term": "Seepage", "definition": "water escaping below or out from water conveyance facilities such as open ditches, canals, natural channels, and waterway"}, {"id": "GEN-97", "subject": "General Terminologies", "term": "Seepage line", "definition": "phreatic line; line with no filter arrangements where seepage occurs"}, {"id": "GEN-98", "subject": "General Terminologies", "term": "Setback distance", "definition": "distance from the perimeter of the irrigation area to the community or area of concern that is sensitive to contamination"}, {"id": "GEN-99", "subject": "General Terminologies", "term": "Side slope", "definition": "ratio of horizontal to vertical dimension of the channel wall"}, {"id": "GEN-100", "subject": "General Terminologies", "term": "Slope of the energy grade line", "definition": "slope of water surface profile plus the velocity head in open channels"}, {"id": "GEN-101", "subject": "General Terminologies", "term": "Slope of the hydraulic grade line", "definition": "slope of the free water surface"}, {"id": "GEN-102", "subject": "General Terminologies", "term": "Spillway", "definition": "channel which releases surplus or flood water which cannot be contained in the active storage space of the reservoir"}, {"id": "GEN-103", "subject": "General Terminologies", "term": "Sprinkler irrigation", "definition": "method of applying irrigation water similar to natural rainfall"}, {"id": "GEN-104", "subject": "General Terminologies", "term": "Sprinkler spacing", "definition": "distance between two sprinkler heads along the lateral"}, {"id": "GEN-105", "subject": "General Terminologies", "term": "Storage capacity", "definition": "total capacity at normal water surface elevation"}, {"id": "GEN-106", "subject": "General Terminologies", "term": "Storage ratio", "definition": "ratio of the storage capacity to the total earth volume required for embankment construction which indicates the relative cost of the different types of reservoir"}, {"id": "GEN-107", "subject": "General Terminologies", "term": "Structural height", "definition": "vertical distance measured from the top of the dam down to the bedrock"}, {"id": "GEN-108", "subject": "General Terminologies", "term": "Surface irrigation system", "definition": "application of water by gravity flow to the surface of the field. - Flooded irrigation (Basin irrigation ) - Water is fed into small channels ( Furrow irrigation ) - Strips of land irrigation ( Borders irrigation )"}, {"id": "GEN-109", "subject": "General Terminologies", "term": "Top width", "definition": "width of the channel cross section at the free surface"}, {"id": "GEN-110", "subject": "General Terminologies", "term": "Unconfined aquifer", "definition": "aquifer which has water table serving as upper surface of the zone of saturation"}, {"id": "GEN-111", "subject": "General Terminologies", "term": "Uniformity coefficient", "definition": "ratio of the particle size at 60% passing to that at 10% passing"}, {"id": "GEN-112", "subject": "General Terminologies", "term": "Uniform flo w", "definition": "occurs when flow has a constant water area, depth, discharge, and average velocity through a reach of channel"}, {"id": "GEN-113", "subject": "General Terminologies", "term": "Unimodal rainfall pattern", "definition": "rainfall pattern with five wet months of more than 20mm/month, five dry months of less than 100mm/month, two transition months of 100mm200mm.month and total annual rainfall above 1500mm"}, {"id": "GEN-114", "subject": "General Terminologies", "term": "Unlined channels", "definition": "unlined canal; canals that are cut through solid, contained gas or other forms resulting from industrial, commercial, mining, or agricultural operations, or from community and household activities that is devoid of usage and discarded"}, {"id": "GEN-115", "subject": "General Terminologies", "term": "Wastewater", "definition": "waste in liquid state containing pollutants"}, {"id": "GEN-116", "subject": "General Terminologies", "term": "Water balance", "definition": "accounting of water inflows, such as irrigation and rainfall, and outflows, such as evaporation, seepage and percolation"}, {"id": "GEN-117", "subject": "General Terminologies", "term": "Watershed", "definition": "area which contributes runoff or drains water into the reservoir"}, {"id": "GEN-118", "subject": "General Terminologies", "term": "Water balance", "definition": "accounting of water inflows, such as irrigation and rainfall, and outflows, such as evaporation, seepage and percolation"}, {"id": "GEN-119", "subject": "General Terminologies", "term": "Watershed", "definition": "area which contributes runoff or drains water into the reservoir"}, {"id": "GEN-120", "subject": "General Terminologies", "term": "Water right", "definition": "privilege granted by the government to use and appropriate water"}, {"id": "GEN-121", "subject": "General Terminologies", "term": "Well log", "definition": "record of formation stratification of an aquifer showing the depth, thickness, degree of consolidation and other aquifer physical characteristics"}, {"id": "GEN-122", "subject": "General Terminologies", "term": "Well protected reservoir", "definition": "reservoir where the upper reaches of the basin is shielded by high mountain barriers"}, {"id": "GEN-123", "subject": "General Terminologies", "term": "Wetted diameter", "definition": "diameter of the circular area wetted by the sprinkler when operating at a given pressure and no wind"}, {"id": "GEN-124", "subject": "General Terminologies", "term": "Wetter perimeter", "definition": "portion of the perimeter of the canal that is in contact with the flowing water"}, {"id": "GEN-125", "subject": "General Terminologies", "term": "Wetted widths", "definition": "width of strip that would be wetted by a row of emitters spaced at their optimal spacing along a single lateral line"}, {"id": "GEN-126", "subject": "General Terminologies", "term": "Zoned embankment", "definition": "dam consisting a central impervious core flanked between zones of more previous materials."}, {"id": "MAT-1", "subject": "Mathematics", "term": "Real number", "definition": "consists of all numbers that can be placed on an infinite number line. It includes every number you use in everyday mathematics"}, {"id": "MAT-2", "subject": "Mathematics", "term": "Natural numbers", "definition": "contain all counting numbers which start from 1. They do not include fractions, decimals, or negative numbers."}, {"id": "MAT-3", "subject": "Mathematics", "term": "Whole numbers", "definition": "a basic set of numbers containing zero and all positive counting numbers/ They extend to infinity and never contain fractions, decimals, or negative values"}, {"id": "MAT-4", "subject": "Mathematics", "term": "Integers", "definition": "the collective result of whole numbers and negative of all natural numbers"}, {"id": "MAT-5", "subject": "Mathematics", "term": "Rational numbers", "definition": "any number that can be expressed as a fraction of two integers, where the numerator is an integer and the denominator is a non -zero integer"}, {"id": "MAT-6", "subject": "Mathematics", "term": "Irrational number", "definition": "any real number that cannot be expresses as a simple fraction (ratio) of two integers"}, {"id": "MAT-7", "subject": "Mathematics", "term": "Properties of real number", "definition": "are the fundamental rules that govern how these numbers (including all rational and irrational numbers) behave under addition a 1nd multiplication. These properties are essential for simplifying algebraic expressions and solving equations"}, {"id": "MAT-8", "subject": "Mathematics", "term": "Closure property", "definition": "the result of adding or multiplying any two real numbers"}, {"id": "MAT-9", "subject": "Mathematics", "term": "Commutative property", "definition": "the order in which you add or multiply numbers does not change the result"}, {"id": "MAT-10", "subject": "Mathematics", "term": "Associate property", "definition": "the grouping numbers in a sequence of additions or multiplications does not change the result"}, {"id": "MAT-11", "subject": "Mathematics", "term": "Distributive property", "definition": "multiplying a number by a sum is the same as multiplying the number each addend individually and then adding the products"}, {"id": "MAT-12", "subject": "Mathematics", "term": "Identity property", "definition": "there are unique real numbers that leave other numbers unchanged when added or multiplied"}, {"id": "MAT-13", "subject": "Mathematics", "term": "Inverse property", "definition": "it states that performing an operation and its opposite will “undo” each other, bringing you back to the system’s baseline"}, {"id": "MAT-14", "subject": "Mathematics", "term": "Zero property", "definition": "multiplying any real number by zero always results in zero"}, {"id": "MAT-15", "subject": "Mathematics", "term": "Arithmetic sequence", "definition": "is an ordered list of numbers where the difference between any two consecutive terms remains constant. Every term is generated by adding or subtracting the exact same number, known as the common difference"}, {"id": "MAT-16", "subject": "Mathematics", "term": "Permutation", "definition": "refers to the arrangement of objects in a definite order. That means permutation is the arrangement objects in which order matters"}, {"id": "MAT-17", "subject": "Mathematics", "term": "Combination", "definition": "is a way of selecting something from a given collection. It involves selecting items from a larger set where the order of selection does not matter"}, {"id": "MAT-18", "subject": "Mathematics", "term": "Probability", "definition": "is the mathematical study of the likelihood of events occurring. The result of any probability calculation is expressed as a number or fraction between 0 and 1, or as a percentage between 0% and 100%"}, {"id": "MAT-19", "subject": "Mathematics", "term": "Mutually exclusive events (disjoint)", "definition": "these events cnnot occur simultaneously. If event A happens, event B absolutely cannot happen"}, {"id": "MAT-20", "subject": "Mathematics", "term": "Non -mutually exclusive events (inclusive )", "definition": "these events share at least one common outcome. They overlap, meaning there is a chance they happen together"}, {"id": "MAT-21", "subject": "Mathematics", "term": "Complementary angles", "definition": "are two angles whose sun is a right angle"}, {"id": "MAT-22", "subject": "Mathematics", "term": "Supplementary angles", "definition": "are two angles whose sum is a straight angle"}, {"id": "MAT-23", "subject": "Mathematics", "term": "Conjugate (explementary) angles", "definition": "two angles whose sum is equal to 360"}, {"id": "MAT-24", "subject": "Mathematics", "term": "Adjacent angles", "definition": "share a common side and a common vertex"}, {"id": "MAT-25", "subject": "Mathematics", "term": "Vertically opposite", "definition": "angles are formed by two intersecting lines, the angles are equal"}, {"id": "MAT-26", "subject": "Mathematics", "term": "Alternate interior angles", "definition": "formed inside the two parallel lines, when intersected by a transversal, are equal to its alternate parts"}, {"id": "MAT-27", "subject": "Mathematics", "term": "Radius", "definition": "is the distance from the center to the edge"}, {"id": "MAT-28", "subject": "Mathematics", "term": "Diameter", "definition": "goes straight across the circle, through the center"}, {"id": "MAT-29", "subject": "Mathematics", "term": "Circumference", "definition": "is the length pf the perimeter of a circle"}, {"id": "MAT-30", "subject": "Mathematics", "term": "Arc", "definition": "is a part of the circumference (major and minor)"}, {"id": "MAT-31", "subject": "Mathematics", "term": "Chord", "definition": "is a line segment going from one point of the circumference to another but does not go through the center"}, {"id": "MAT-32", "subject": "Mathematics", "term": "Secant", "definition": "is a line that touches the circle at a single point only"}, {"id": "MAT-33", "subject": "Mathematics", "term": "Sector", "definition": "is bounded by two radii and an included arc (major and minor)"}, {"id": "MAT-34", "subject": "Mathematics", "term": "Segment", "definition": "is bounded by a chord and the arc subtending the chord"}, {"id": "MAT-35", "subject": "Mathematics", "term": "Alternate segment", "definition": "the angle lies between a tangent and a chord is equal to the angle subtended by the same chord"}, {"id": "MAT-36", "subject": "Mathematics", "term": "Triangle", "definition": "is a plane figure that is enclosed by three -line segments"}, {"id": "MAT-37", "subject": "Mathematics", "term": "Scalene triangle", "definition": "a triangle with no equal side"}, {"id": "MAT-38", "subject": "Mathematics", "term": "Isosceles triangle", "definition": "a triangle with two equal side"}, {"id": "MAT-39", "subject": "Mathematics", "term": "Equilateral triangle", "definition": "a triangle with all equal side"}, {"id": "MAT-40", "subject": "Mathematics", "term": "Acute triangle", "definition": "a triangle with less than 90 degrees"}, {"id": "MAT-41", "subject": "Mathematics", "term": "Obtuse triangle", "definition": "a triangle with greater than 90 degrees"}, {"id": "MAT-42", "subject": "Mathematics", "term": "Right triangle", "definition": "a triangle with one angle equal to 90 degrees"}, {"id": "MAT-43", "subject": "Mathematics", "term": "Rhomboid", "definition": "is a parallelogram whose adjacent sides are not equal"}, {"id": "MAT-44", "subject": "Mathematics", "term": "Rhombus", "definition": "is a rhomboid with all sides equal"}, {"id": "MAT-45", "subject": "Mathematics", "term": "Trapezoid", "definition": "a quadrilateral with two parallel sides"}, {"id": "MAT-46", "subject": "Mathematics", "term": "Trapezium", "definition": "a quadrilateral with no parallel sides"}, {"id": "MAT-47", "subject": "Mathematics", "term": "Concave polygon", "definition": "a polygon having at least one interior angle greater than 180"}, {"id": "MAT-48", "subject": "Mathematics", "term": "Convex polygon", "definition": "a polygon where all interior angles are less than 180"}, {"id": "MAT-49", "subject": "Mathematics", "term": "Regular polygon", "definition": "a polygon having all sides equal and all angles equal"}, {"id": "MAT-50", "subject": "Mathematics", "term": "Diagonal", "definition": "a line that connects two non -adjacent vertices"}, {"id": "MAT-51", "subject": "Mathematics", "term": "Apothem", "definition": "a line from the center of a regular polygon perpendicular to one of its sides. This is equal to the radius of the inscribed circle"}, {"id": "MAT-52", "subject": "Mathematics", "term": "Similar polygons", "definition": "polygon whose corresponding angles are equal, and corresponding sides are proportional"}, {"id": "MAT-53", "subject": "Mathematics", "term": "Regular polyhedrons", "definition": "are solid figures whose faces are all identical. Only five exist"}, {"id": "MAT-54", "subject": "Mathematics", "term": "Platonic solids", "definition": "the tetrahedron, hexahedron, octahedron, dodecahedron, and icosahedr"}, {"id": "MAT-55", "subject": "Mathematics", "term": "Prism", "definition": "is a polyhedron with two parallel, congruent bases and lateral faces that are parallelogram"}, {"id": "MAT-56", "subject": "Mathematics", "term": "Right prism", "definition": "has lateral faces perpendicular to its base"}, {"id": "MAT-57", "subject": "Mathematics", "term": "Oblique prism", "definition": "has lateral faces that are not perpendicular to the base"}, {"id": "MAT-58", "subject": "Mathematics", "term": "Truncated prism", "definition": "is formed when a prism is cut by a plane that is not parallel to the base"}, {"id": "MAT-59", "subject": "Mathematics", "term": "Pyramid", "definition": "is a polyhedron with a polygonal base and triangular sides that meet a single point called vertex"}, {"id": "MAT-60", "subject": "Mathematics", "term": "Frustum", "definition": "is the section of the pyramid between its base and a plane parallel to the base"}, {"id": "MAT-61", "subject": "Mathematics", "term": "Cylinde r", "definition": "is a solid bounded by a closed cylindrical surface and two parallel lines"}, {"id": "MAT-62", "subject": "Mathematics", "term": "Cone", "definition": "is solid bounded by a conical surface (lateral surface) whose directrix is a close curved, and a plane (base) which cuts all the elemetns"}, {"id": "MAT-63", "subject": "Mathematics", "term": "Sphere", "definition": "is a solid bounded by a closed surface every point of which is equidistant from a fixed point called center"}, {"id": "MAT-64", "subject": "Mathematics", "term": "Spherical wedge", "definition": "is a portion of a sphere bounded by two half great circles and an included arc"}, {"id": "MAT-65", "subject": "Mathematics", "term": "Spherical polygon", "definition": "is a polygon on the surface of a sphere whose sides are arcs of great circles"}, {"id": "MAT-66", "subject": "Mathematics", "term": "Prismatoid", "definition": "is a polyhedron with two polygons bases lying in a parallel planes. Its lateral faces are either triangles or trapezoids, each connecting one base to the other"}, {"id": "MAT-67", "subject": "Mathematics", "term": "Torus", "definition": "is a solid formed by revolving a circle about a line not intersecting it"}, {"id": "MAT-68", "subject": "Mathematics", "term": "Ellipsoid", "definition": "is a solid formed by revolving an ellipse about its axis"}, {"id": "MAT-69", "subject": "Mathematics", "term": "Prolate spheroid", "definition": "is a solid formed by revolving an ellipse about its major axis"}, {"id": "MAT-70", "subject": "Mathematics", "term": "Oblate spheroid", "definition": "is a solid formed by revolving an ellipse about its minor axis"}, {"id": "MAT-71", "subject": "Mathematics", "term": "Trigonometr y", "definition": "is the branch of mathematics that studies triangles by exploring the relationships between the sides and angles"}, {"id": "MAT-72", "subject": "Mathematics", "term": "Plane trigonometry", "definition": "focuses on triangles that lie on a flat surface"}, {"id": "MAT-73", "subject": "Mathematics", "term": "Spherical trigonometry", "definition": "deals with triangles formed on the surface of a sphere"}, {"id": "MAT-74", "subject": "Mathematics", "term": "Median", "definition": "part of the triangle that line drawn from one vertex to the midpoint of its opposite side"}, {"id": "MAT-75", "subject": "Mathematics", "term": "Centroid", "definition": "the medians of a triangle intersect at a common point"}, {"id": "MAT-76", "subject": "Mathematics", "term": "Altitude", "definition": "part of the triangle that the line drawn from one vertex perpendicular"}, {"id": "MAT-77", "subject": "Mathematics", "term": "Orthocente r", "definition": "the altitudes of a triangle intersect at a point"}, {"id": "MAT-78", "subject": "Mathematics", "term": "Angle bisector", "definition": "part of triangle that the line drawn from one vertex to the opposite side of bisecting the included angle between the other two sides"}, {"id": "MAT-79", "subject": "Mathematics", "term": "Incenter", "definition": "the angle bisectors of a triangle intersect at a point"}, {"id": "MAT-80", "subject": "Mathematics", "term": "Great circle", "definition": "a circle on the surface of a sphere whose plane passes through the center of the sphere"}, {"id": "MAT-81", "subject": "Mathematics", "term": "Spherical angle", "definition": "an angle formed by the intersection of two great circles"}, {"id": "MAT-82", "subject": "Mathematics", "term": "Spherical triangle", "definition": "a triangle on the surface of the sphere formed by the intersection of three great circles"}, {"id": "MAT-83", "subject": "Mathematics", "term": "Circle", "definition": "is produced when the cutting plane is parallel to the base of the core"}, {"id": "MAT-84", "subject": "Mathematics", "term": "Ellipse", "definition": "is produced when the cutting plane is not parallel (or inclined) to the base of the cone"}, {"id": "MAT-85", "subject": "Mathematics", "term": "Parabola", "definition": "is produced when the cutting plane is parallel to the element (or generatrix) of the cone"}, {"id": "MAT-86", "subject": "Mathematics", "term": "Hyperbola", "definition": "is produced when the cutting plane is parallel to the axis of the cone"}, {"id": "MAT-87", "subject": "Mathematics", "term": "Quadrilateral", "definition": "4 sides"}, {"id": "MAT-88", "subject": "Mathematics", "term": "Pentagon", "definition": "5 sides"}, {"id": "MAT-89", "subject": "Mathematics", "term": "Hexagon", "definition": "6 sides"}, {"id": "MAT-90", "subject": "Mathematics", "term": "Heptagon", "definition": "7 sides"}, {"id": "MAT-91", "subject": "Mathematics", "term": "Octagon", "definition": "8 sides"}, {"id": "MAT-92", "subject": "Mathematics", "term": "Nonagon", "definition": "9 sides"}, {"id": "MAT-93", "subject": "Mathematics", "term": "Decagon", "definition": "10 sides"}, {"id": "MAT-94", "subject": "Mathematics", "term": "Hendecagon (Undecagon)", "definition": "11 sides"}, {"id": "MAT-95", "subject": "Mathematics", "term": "Dodecagon", "definition": "12 sides"}, {"id": "MAT-96", "subject": "Mathematics", "term": "Triskaidecagon", "definition": "13 sides"}, {"id": "MAT-97", "subject": "Mathematics", "term": "Tetradecagon", "definition": "14 sides"}, {"id": "MAT-98", "subject": "Mathematics", "term": "Pentadecagon", "definition": "15 sides"}, {"id": "MAT-99", "subject": "Mathematics", "term": "Hexadecagon", "definition": "16 sides"}, {"id": "MAT-100", "subject": "Mathematics", "term": "Heptadecagon", "definition": "17 sides"}, {"id": "MAT-101", "subject": "Mathematics", "term": "Octadecagon", "definition": "18 sides"}, {"id": "MAT-102", "subject": "Mathematics", "term": "Enneadecagon", "definition": "19 sides"}, {"id": "MAT-103", "subject": "Mathematics", "term": "Icosagon", "definition": "20 sides"}, {"id": "MAT-104", "subject": "Mathematics", "term": "Function", "definition": "is a mathematical rule that assigns exactly one output to every allowable input"}, {"id": "MAT-105", "subject": "Mathematics", "term": "Domain", "definition": "the set of all possible input values for which the function is defined"}, {"id": "MAT-106", "subject": "Mathematics", "term": "Range", "definition": "the set of all possible output values"}, {"id": "MAT-107", "subject": "Mathematics", "term": "Limit of the function", "definition": "describes the behavior of the function as the input (usually x) approaches a specific value"}, {"id": "MAT-108", "subject": "Mathematics", "term": "Removable discontinuity", "definition": "hole in the d levels on slopes to reduce water erosion by intercepting and managing surface runoff"}, {"id": "SOI-39", "subject": "Soil and Water Conservation Engineering", "term": "Grassed waterway", "definition": "a channel covered with grass to prevent erosion and manage runoff"}, {"id": "SOI-40", "subject": "Soil and Water Conservation Engineering", "term": "Design of grass water way", "definition": "the design considers storm runoff, calculated using the rational formula and area -velocity method"}, {"id": "SOI-41", "subject": "Soil and Water Conservation Engineering", "term": "Velocity in grass waterways", "definition": "flow velocity depends on vegetation and soil, with typical velocities between 1.0 to and 2.5 m/s"}, {"id": "SOI-42", "subject": "Soil and Water Conservation Engineering", "term": "Broad -channel terraces", "definition": "terraces with wide, shallow channels designed to safely carry runoff at low velocities"}, {"id": "SOI-43", "subject": "Soil and Water Conservation Engineering", "term": "Ridge terraces", "definition": "terraces formed by creating ridges to direct water over wide surfaces to increase water absorption"}, {"id": "SOI-44", "subject": "Soil and Water Conservation Engineering", "term": "Bench terraces", "definition": "steeped terraces used on steep land to create flat planting areas, helping control erosion and water runoff"}, {"id": "SOI-45", "subject": "Soil and Water Conservation Engineering", "term": "Table top terraces", "definition": "terraces with a level top designed to trap rainfall and impr ove water infiltration"}, {"id": "SOI-46", "subject": "Soil and Water Conservation Engineering", "term": "Sloppy inward terraces", "definition": "bench terraces that slope outward to promote drainage in areas with low rainfall and permeable soil"}, {"id": "SOI-47", "subject": "Soil and Water Conservation Engineering", "term": "Sloppy inward terraces", "definition": "bench terraces that slope inward for areas with heavy rainfall and less permeable soils, incorporating drainage system for water disposal"}, {"id": "SOI-48", "subject": "Soil and Water Conservation Engineering", "term": "Level bench terrace", "definition": "a flat terrace used in areas with medium rainfall and permeable soil to absorb surface runoff"}, {"id": "SOI-49", "subject": "Soil and Water Conservation Engineering", "term": "Bench terrace slopping outward", "definition": "terraces that slope outward, often used in areas with low rainfall and permeable soils, for orchard farming or similar purposes"}, {"id": "SOI-50", "subject": "Soil and Water Conservation Engineering", "term": "Bench terraces slopping", "definition": "terraces that slope inward, used for areas with high rainfall and less permeable soils to prevent waterlogging"}, {"id": "SOI-51", "subject": "Soil and Water Conservation Engineering", "term": "Rainfall erosivity factor ( R )", "definition": "measures rainfall’s potential to cause soil erosion based in intensity and kinetic energy"}, {"id": "SOI-52", "subject": "Soil and Water Conservation Engineering", "term": "Soil erodibility factor (K)", "definition": "described soil’s susceptibility to erosion, based on type and characteristics"}, {"id": "SOI-53", "subject": "Soil and Water Conservation Engineering", "term": "Topographic factor (LS)", "definition": "accounts for the effect of slope length and steepness on erosion"}, {"id": "SOI-54", "subject": "Soil and Water Conservation Engineering", "term": "Crop management factor ( C )", "definition": "represents the effect of crops on soil erosion compared to fallow land"}, {"id": "SOI-55", "subject": "Soil and Water Conservation Engineering", "term": "Support practice factor (P)", "definition": "measures soil loss reduction due to conservation practices"}, {"id": "SOI-56", "subject": "Soil and Water Conservation Engineering", "term": "USLE (Universal Soil Loss Equation)", "definition": "estimate soil loss based on R, K, LS, C, and P factors"}, {"id": "SOI-57", "subject": "Soil and Water Conservation Engineering", "term": "MUSLE (Modified USLE)", "definition": "a version of USLE that uses runoff volume and peak flow instead of rainfall energy"}, {"id": "SOI-58", "subject": "Soil and Water Conservation Engineering", "term": "Erosivity", "definition": "refers to the ability of rainfall to erode soil, influenced by intensity and other factors"}, {"id": "SOI-59", "subject": "Soil and Water Conservation Engineering", "term": "Factors affecting rainfall erosivity", "definition": "includes intensity, drop size, wind velocity, and slope direction"}, {"id": "SOI-60", "subject": "Soil and Water Conservation Engineering", "term": "Rainfall erosivity estimation methods", "definition": "methods include the EI30 index and KE>25 index, which estimate erosivity"}];
    const subjects = [...new Set(questionBank.map(q => q.subject))];
    let selectedSubject = subjects[0];
    let quiz = [];
    let index = 0;
    let answers = [];
    let selected = null;

    const byId = id => document.getElementById(id);

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function show(id) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      byId(id).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderSubjects() {
      byId('subjects').innerHTML = subjects.map(subject => {
        const total = questionBank.filter(q => q.subject === subject).length;
        return `<button class="subject ${subject === selectedSubject ? 'selected' : ''}" onclick="selectSubject('${subject.replace(/'/g, "\\'")}')">
          <b>${subject}</b><span>${total} available questions</span>
        </button>`;
      }).join('');
      updateCountLimit();
    }

    function selectSubject(subject) {
      selectedSubject = subject;
      renderSubjects();
    }

    function updateCountLimit() {
      const max = questionBank.filter(q => q.subject === selectedSubject).length;
      const count = byId('count');
      count.max = max;
      if (+count.value > max) count.value = max;
      if (+count.value < 10) count.value = Math.min(10, max);
    }

    function answerKind(text) {
      const value = String(text).trim();
      const startsNumeric = /^[<>~≈≤≥]?\s*\d/.test(value);
      const hasMeasurement = /\b(sides?|mm|cm|m|km|ha|l\/sec|mg\/l|ppm|ppt|kph|year|years|month|months|mins?|w\/sq\.?m|%|c)\b/i.test(value);
      return startsNumeric || (/\d/.test(value) && hasMeasurement) ? 'value' : 'term';
    }

    function makeQuestion(item, pool) {
      const definitionIsValue = answerKind(item.definition) === 'value';
      const answerField = definitionIsValue ? 'definition' : 'term';
      const questionField = definitionIsValue ? 'term' : 'definition';
      const answer = item[answerField];
      const kind = answerKind(answer);
      const sameKind = pool.filter(q => q !== item && answerKind(q[answerField]) === kind && q[answerField] !== answer);
      const fallback = pool.filter(q => q !== item && q[answerField] !== answer);
      const source = sameKind.length >= 3 ? sameKind : fallback;
      const distractors = shuffle(source).slice(0, 3).map(q => q[answerField]);
      const choices = shuffle([answer, ...distractors]);
      return { ...item, answer, prompt: item[questionField], choices, correctIndex: choices.indexOf(answer) };
    }

    function startQuiz() {
      const pool = questionBank.filter(q => q.subject === selectedSubject);
      const requested = Math.max(10, Math.min(parseInt(byId('count').value || '10', 10), pool.length));
      byId('count').value = requested;
      quiz = shuffle(pool).slice(0, requested).map(item => makeQuestion(item, pool));
      index = 0;
      answers = [];
      selected = null;
      show('quiz');
      renderQuestion();
    }

    function renderQuestion() {
      const q = quiz[index];
      selected = null;
      byId('qSubject').textContent = q.subject;
      byId('qText').textContent = q.prompt;
      byId('progressText').textContent = `Question ${index + 1} of ${quiz.length}`;
      byId('percentText').textContent = `${Math.round((index / quiz.length) * 100)}% complete`;
      byId('fill').style.width = `${(index / quiz.length) * 100}%`;
      byId('nextBtn').textContent = index === quiz.length - 1 ? 'Finish Quiz' : 'Next Question';
      byId('nextBtn').disabled = true;
      byId('options').innerHTML = q.choices.map((choice, i) => `
        <button class="option" onclick="choose(${i})" id="opt${i}">
          <span class="letter">${String.fromCharCode(65 + i)}</span>
          <span>${escapeHtml(choice)}</span>
        </button>`).join('');
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function choose(choiceIndex) {
      selected = choiceIndex;
      document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
      byId(`opt${choiceIndex}`).classList.add('selected');
      byId('nextBtn').disabled = false;
    }

    function nextQuestion() {
      if (selected === null) return;
      answers[index] = selected;
      if (index < quiz.length - 1) {
        index += 1;
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      const correct = quiz.reduce((sum, q, i) => sum + (answers[i] === q.correctIndex ? 1 : 0), 0);
      const pct = Math.round((correct / quiz.length) * 100);
      byId('scoreNum').textContent = `${pct}%`;
      byId('summary').textContent = `You scored ${correct} out of ${quiz.length} in ${selectedSubject}. Review the correct answers below.`;
      byId('review').innerHTML = quiz.map((q, i) => {
        const ok = answers[i] === q.correctIndex;
        return `<div class="panel review-card ${ok ? 'good' : 'bad'}">
          <p class="tiny">Question ${i + 1} - ${q.subject}</p>
          <p><b>Definition:</b> ${escapeHtml(q.definition)}</p>
          <p><b>Your answer:</b> ${escapeHtml(q.choices[answers[i]])}</p>
          <p><b>Correct answer:</b> ${escapeHtml(q.answer)}</p>
        </div>`;
      }).join('');
      byId('fill').style.width = '100%';
      show('results');
    }

    function resetHome() {
      quiz = [];
      answers = [];
      index = 0;
      selected = null;
      renderSubjects();
      show('home');
    }

    byId('count').addEventListener('input', updateCountLimit);
    renderSubjects();
  </script>
</body>
</html>
